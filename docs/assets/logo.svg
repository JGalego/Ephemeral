<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Ephemeral">
  <title>Ephemeral</title>
  <desc>Three bubbles in sequence: one whole, one rupturing, one already gone.</desc>

  <defs>
    <!-- Soap film is mostly transparent: the colour gathers at the edge, where
         you are looking through the most of it. Keeping the middle nearly clear
         is what stops a bubble reading as a solid ball. -->
    <radialGradient id="film" cx="36%" cy="30%" r="80%">
      <stop offset="0%"   stop-color="#a5b4fc" stop-opacity="0.10" />
      <stop offset="55%"  stop-color="#5eead4" stop-opacity="0.08" />
      <stop offset="84%"  stop-color="#c4b5fd" stop-opacity="0.20" />
      <stop offset="100%" stop-color="#f0abfc" stop-opacity="0.42" />
    </radialGradient>

    <!-- The rim is brightest where the film is edge-on to you. -->
    <linearGradient id="rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#c4b5fd" stop-opacity="0.95" />
      <stop offset="45%"  stop-color="#5eead4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#f0abfc" stop-opacity="0.95" />
    </linearGradient>

    <!-- A film that has torn: still bright where it holds, gone where it does not. -->
    <linearGradient id="tearing" x1="10%" y1="100%" x2="90%" y2="0%">
      <stop offset="0%"   stop-color="#7dd3fc" stop-opacity="0.95" />
      <stop offset="55%"  stop-color="#c4b5fd" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#f0abfc" stop-opacity="0.55" />
    </linearGradient>

    <!-- A soft glint rather than a hard white blob. -->
    <radialGradient id="glint" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="55%"  stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- 1. Whole. The film holds, and you can see straight through it. -->
  <circle cx="92" cy="140" r="62" fill="url(#film)" />
  <circle cx="92" cy="140" r="62" fill="none" stroke="url(#rim)" stroke-width="3" />
  <ellipse cx="68" cy="113" rx="20" ry="13" fill="url(#glint)" transform="rotate(-34 68 113)" />
  <circle cx="115" cy="107" r="3.4" fill="#ffffff" opacity="0.52" />

  <!-- 2. Rupturing. The rim has sprung outward and torn into uneven arcs; what
       is left of the film is already going, and the first droplets are clear. -->
  <g transform="rotate(-20 182 72)">
    <circle cx="182" cy="72" r="34" fill="url(#film)" opacity="0.16" />
    <circle cx="182" cy="72" r="37" fill="none" stroke="url(#tearing)" stroke-width="3"
            stroke-linecap="round" stroke-dasharray="44 16 25 12 36 20 29 14" />
  </g>
  <circle cx="232" cy="44" r="2.5" fill="#f0abfc" opacity="0.8" />
  <circle cx="228" cy="102" r="2" fill="#7dd3fc" opacity="0.7" />
  <circle cx="141" cy="40" r="1.8" fill="#c4b5fd" opacity="0.6" />
  <circle cx="188" cy="20" r="1.4" fill="#5eead4" opacity="0.55" />

  <!-- 3. Gone. Nothing is left of the third bubble but the spray, still
       carrying the colour of the film it came from. -->
  <circle cx="174" cy="184" r="2.8" fill="#c4b5fd" opacity="0.75" />
  <circle cx="203" cy="167" r="2.2" fill="#f0abfc" opacity="0.7" />
  <circle cx="223" cy="190" r="2.5" fill="#7dd3fc" opacity="0.65" />
  <circle cx="205" cy="212" r="1.9" fill="#5eead4" opacity="0.6" />
  <circle cx="178" cy="212" r="1.5" fill="#f0abfc" opacity="0.58" />
  <circle cx="236" cy="164" r="1.3" fill="#c4b5fd" opacity="0.52" />
  <circle cx="156" cy="164" r="1.2" fill="#7dd3fc" opacity="0.48" />
  <circle cx="221" cy="228" r="1.1" fill="#c4b5fd" opacity="0.44" />
</svg>
