<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Ephemeral">
  <title>Ephemeral</title>
  <desc>One bubble's life in three stages: whole, breaking up, and gone — leaving only the traces of where it went.</desc>

  <defs>
    <!-- Soap film is mostly transparent: the colour gathers at the edge, where
         you look through the most of it. A clear middle is what stops a bubble
         reading as a solid ball. -->
    <radialGradient id="film" cx="36%" cy="30%" r="80%">
      <stop offset="0%"   stop-color="#a5b4fc" stop-opacity="0.10" />
      <stop offset="55%"  stop-color="#5eead4" stop-opacity="0.08" />
      <stop offset="84%"  stop-color="#c4b5fd" stop-opacity="0.20" />
      <stop offset="100%" stop-color="#f0abfc" stop-opacity="0.42" />
    </radialGradient>

    <!-- The rim is brightest where the film is edge-on to you. -->
    <linearGradient id="rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#c4b5fd" stop-opacity="0.95" />
      <stop offset="45%"  stop-color="#5eead4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#f0abfc" stop-opacity="0.95" />
    </linearGradient>

    <!-- A rim that is coming apart: still bright where it holds, fading away
         where it has already let go. -->
    <linearGradient id="breaking" x1="8%" y1="100%" x2="92%" y2="0%">
      <stop offset="0%"   stop-color="#7dd3fc" stop-opacity="0.95" />
      <stop offset="55%"  stop-color="#c4b5fd" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#f0abfc" stop-opacity="0.55" />
    </linearGradient>

    <!-- A soft glint rather than a hard white blob. -->
    <radialGradient id="glint" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="55%"  stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- 1. Whole. The film holds, and you see straight through it. -->
  <circle cx="88" cy="140" r="60" fill="url(#film)" />
  <circle cx="88" cy="140" r="60" fill="none" stroke="url(#rim)" stroke-width="3" />
  <ellipse cx="65" cy="114" rx="19" ry="12.5" fill="url(#glint)" transform="rotate(-34 65 114)" />
  <circle cx="110" cy="108" r="3.2" fill="#ffffff" opacity="0.5" />

  <!-- 2. Mid-pop. The film is gone and only the rim is left, already coming
       apart. The dashes are deliberately uneven — an evenly dotted circle reads
       as a UI border, not as something failing. -->
  <circle cx="186" cy="72" r="36" fill="none" stroke="url(#breaking)" stroke-width="3"
          stroke-linecap="round" stroke-dasharray="31 12 17 9 26 15 21 10"
          transform="rotate(-24 186 72)" />

  <!-- 3. Popped. Only the traces of where it went. They all point away from one
       centre, and that shared centre is what says a bubble was here rather than
       a scribble — the eye reconstructs the bubble from the way they radiate. -->
  <g fill="none" stroke-linecap="round">
    <path d="M 204.8 192.4 L 222.7 194.9" stroke="#f0abfc" stroke-width="2.6" opacity="0.8" />
    <path d="M 198.9 201.7 L 209.1 212.7" stroke="#c4b5fd" stroke-width="2.4" opacity="0.7" />
    <path d="M 188.6 208 L 189.3 227"     stroke="#7dd3fc" stroke-width="2.6" opacity="0.75" />
    <path d="M 178.5 204.1 L 170.7 215.7" stroke="#5eead4" stroke-width="2.2" opacity="0.6" />
    <path d="M 169.8 195.6 L 153.6 200.5" stroke="#a5b4fc" stroke-width="2.5" opacity="0.7" />
    <path d="M 173.1 184.3 L 157.2 178.2" stroke="#c4b5fd" stroke-width="2.3" opacity="0.62" />
    <path d="M 180 175 L 172 160"         stroke="#7dd3fc" stroke-width="2.4" opacity="0.66" />
    <path d="M 192.7 172.6 L 197.8 153.3" stroke="#f0abfc" stroke-width="2.6" opacity="0.72" />
    <path d="M 200.6 180.2 L 213.2 170.3" stroke="#5eead4" stroke-width="2.2" opacity="0.58" />
  </g>
</svg>
