[workspace]
resolver = "3"
members = [
    "crates/ephemeral-core",
    "crates/ephemeral-runtime",
    "crates/ephemeral-agent",
    "crates/ephemeral-provider-anthropic",
    "crates/ephemeral-provider-openai",
    "crates/ephemeral-provider-local",
    "crates/ephemeral-api",
    "crates/ephemeral-engine",
    "crates/ephemeral-cli",
    "crates/ephemeral-ffi",
    "crates/ephemeral-android",
    "crates/ephemeral-design",
]

# The desktop window is its own workspace. Tauri brings a large native
# dependency tree and system libraries that only exist on a machine with a
# desktop; everything else here must stay buildable and testable without them.
# Neither of these belongs in the workspace, for opposite reasons. The desktop
# window needs system libraries the rest of Ephemeral must not require; the
# reference application is built for `wasm32-wasip1` and would otherwise be
# compiled for the host by every `cargo test --workspace`, which is the one
# platform it is not for.
exclude = ["apps/desktop/src-tauri", "examples/tally"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/JGalego/Ephemeral"
homepage = "https://github.com/JGalego/Ephemeral"
authors = ["The Ephemeral contributors"]

[workspace.dependencies]
ephemeral-core = { path = "crates/ephemeral-core", version = "0.1.0" }
ephemeral-runtime = { path = "crates/ephemeral-runtime", version = "0.1.0" }
ephemeral-agent = { path = "crates/ephemeral-agent", version = "0.1.0" }
ephemeral-provider-anthropic = { path = "crates/ephemeral-provider-anthropic", version = "0.1.0" }
# Default features off at the root: the local provider borrows this crate's wire
# format and nothing else, and pulling a subprocess transport in behind it would
# quietly undo the portability check (ADR-0016). A consumer that sends requests
# asks for `curl` explicitly.
ephemeral-provider-openai = { path = "crates/ephemeral-provider-openai", version = "0.1.0", default-features = false }
ephemeral-provider-local = { path = "crates/ephemeral-provider-local", version = "0.1.0" }
ephemeral-api = { path = "crates/ephemeral-api", version = "0.1.0" }
ephemeral-engine = { path = "crates/ephemeral-engine", version = "0.1.0" }
ephemeral-ffi = { path = "crates/ephemeral-ffi", version = "0.1.0" }

anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = [
  "clock",
  "serde",
  "std",
] }
clap = { version = "4.6.6", features = ["derive", "env", "wrap_help"] }
hex = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_norway = "0.9.42"
sha2 = "0.10.9"
tempfile = "3.27.0"
thiserror = "2.0.20"
uuid = { version = "1.24.1", features = ["v4", "serde"] }

# Lints applied across every crate in the workspace. Ephemeral runs untrusted
# generated code, so the defaults are deliberately strict: a panic in the
# supervising process is an availability bug, and an undocumented public item in
# the domain model is a security-review gap.
[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Panicking paths are denied outside tests; see CONTRIBUTING.md.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
# Noise from `pedantic` that does not earn its keep in this codebase.
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
