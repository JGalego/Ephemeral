name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Called by the release workflow, so that nothing is ever published unless
  # every check here is true of the exact commit being released. Without this
  # the release fails at its first job, which is how it sat until somebody ran
  # it: a reusable workflow that never declared itself reusable.
  workflow_call:

# A superseded run tells you nothing useful, so cancel it — except on main,
# where every commit's result is part of the record.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Deliberately no workspace-wide `RUSTFLAGS: -D warnings`: it applies to
  # dependencies as well, so an upstream crate emitting a warning would turn
  # the pipeline red for something we did not write and cannot fix. The lint
  # job denies warnings on our own code, which is the part we control.

jobs:
  format:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - run: cargo fmt --all -- --check

  lint:
    name: Lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features

  # The security suite runs as its own job so that a failure is legible at a
  # glance rather than buried in a general test run. Each of its tests is an
  # executable statement of something SECURITY.md promises.
  security-invariants:
    name: Security invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p ephemeral-core --test security -- --nocapture

  # ephemeral-core must stay free of host I/O: the domain layer is compiled for
  # five platforms, and anything that touches the host belongs behind a trait in
  # another crate (ADR-0002). Building without default features is what keeps
  # that honest rather than aspirational.
  domain-purity:
    name: Domain layer has no host I/O
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p ephemeral-core --no-default-features
      - run: cargo test -p ephemeral-core --no-default-features
      # The same argument applies one layer out: what a sandbox confines is
      # decided by pure functions, so the decision compiles and is tested
      # without the half of the crate that can spawn a process (ADR-0014).
      - run: cargo build -p ephemeral-runtime --no-default-features
      - run: cargo test -p ephemeral-runtime --no-default-features

      # The pipeline's own files. A workflow that does not parse fails before
      # any job, with nothing to read — so this cannot catch the file it lives
      # in, but it catches every other one, and it is what `scripts/check`
      # runs too.
      - run: |
          python3 - <<'PARSE'
          import sys, pathlib
          try:
              import yaml
          except ImportError:
              print("(skipping: no pyyaml here; CI has it)")
              sys.exit(0)


          class Strict(yaml.SafeLoader):
              """A loader that refuses what GitHub refuses.

              PyYAML keeps the last of a duplicated key and says nothing. Actions rejects
              the whole file. That difference is not academic: `device.yml` declared
              `model` twice — the phone and the language model — and every push produced a
              failed run with zero jobs and no log, for twenty-three commits, while this
              check reported it fine.
              """


          def no_duplicates(loader, node, deep=False):
              seen = set()
              for key, _ in node.value:
                  name = loader.construct_object(key, deep=deep)
                  if name in seen:
                      raise yaml.constructor.ConstructorError(
                          None, None, f"{name!r} is declared twice", key.start_mark
                      )
                  seen.add(name)
              return yaml.SafeLoader.construct_mapping(loader, node, deep)


          Strict.add_constructor(yaml.resolver.BaseResolver.DEFAULT_MAPPING_TAG, no_duplicates)

          broken = 0
          for path in sorted(pathlib.Path(".github/workflows").glob("*.yml")):
              try:
                  loaded = yaml.load(path.read_text(), Loader=Strict)
              except yaml.YAMLError as error:
                  print(f"  {path}: {error}")
                  broken += 1
                  continue

              # Parsing is necessary and not sufficient: a file that reads as a string
              # rather than a workflow parses perfectly and runs nothing.
              if not isinstance(loaded, dict) or "jobs" not in loaded:
                  print(f"  {path}: parses, but declares no jobs")
                  broken += 1
                  continue

              # `on` is the YAML 1.1 boolean true, which is why this looks for both. A
              # workflow with no trigger at all is one nothing will ever run.
              if "on" not in loaded and True not in loaded:
                  print(f"  {path}: declares no trigger, so nothing will run it")
                  broken += 1
                  continue

              print(f"  ok  {path} ({len(loaded['jobs'])} jobs)")

          sys.exit(1 if broken else 0)
          PARSE

      # The WebAssembly runtime is behind a feature, so neither the default
      # build nor the default test run touches it. What it claims — that a
      # module gets what it was granted and nothing else — is the reason it
      # exists, so it is checked on its own.
      - run: cargo clippy -p ephemeral-runtime --features wasm --all-targets -- -D warnings
      # Quoted: a plain YAML scalar may not end in a colon, and `wasm::` does.
      # Unquoted, this file does not parse, no job runs at all, and the run
      # fails before it starts — which is what happened, four pushes running.
      - run: "cargo test -p ephemeral-runtime --features wasm wasm::"

  # CI never makes a live model call (ADR-0008). Generation is exercised
  # entirely through the deterministic mock provider, so this job proves the
  # loop works without a credential, a network connection, or a bill.
  generation:
    name: Generation runs against the mock only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p ephemeral-agent
      - name: The whole journey, sentence to running application
        run: cargo test -p ephemeral-agent --test journey -- --nocapture
      - name: The reference application actually runs
        run: cargo test -p ephemeral-agent --test reference_app -- --nocapture
      - name: No network client in the agent crate
        run: |
          if grep -rniE 'reqwest|hyper|ureq|api\.anthropic|api\.openai' \
               crates/ephemeral-agent/src crates/ephemeral-agent/Cargo.toml; then
            echo "A network client appeared in the agent crate."
            echo "Live model calls must stay out of CI (ADR-0008)."
            exit 1
          fi
          echo "No network client in the agent crate."
      - run: cargo test -p ephemeral-provider-anthropic
      - run: cargo test -p ephemeral-provider-openai
      - run: cargo test -p ephemeral-provider-local
      # Generating and running now live in one crate both clients call, so the
      # job that proves generation never needs a live model has to cover it.
      - run: cargo test -p ephemeral-engine
      # Generating is an HTTPS request; iOS cannot spawn a process. A provider
      # whose only transport is `curl` silently decides that Ephemeral cannot
      # generate on a phone, so the crate must build with no subprocess at all
      # (ADR-0007). This is the check that keeps mobile generation possible.
      - name: Generation is portable off the desktop
        run: |
          for provider in anthropic openai local; do
            cargo build -p "ephemeral-provider-$provider" --no-default-features
            cargo test -p "ephemeral-provider-$provider" --no-default-features
          done
      # Swift and Kotlin both reach Ephemeral through C. Compiling a host
      # against the real header and static library is the only check that
      # catches a declaration drifting from its export.
      - name: The C ABI a phone links against
        run: crates/ephemeral-ffi/tests/c-abi.sh
      # Compiling for x86-64 proves the contract; it does not prove the crate
      # survives the trip to a device. A static library is assembled rather
      # than linked, so iOS and Android archives build here without Xcode or
      # the NDK, and their symbol tables are checked against the header.
      - name: Ephemeral builds for the device
        run: crates/ephemeral-ffi/tests/device-targets.sh
        env:
          # A check that quietly stops checking is worse than no check.
          EPHEMERAL_REQUIRE_SYMBOLS: 1
      # Android reaches that C ABI through JNI, which is resolved by name at run
      # time — so a drifted symbol or signature compiles and then fails on a
      # phone. A desktop JVM binds it identically, and the runner has one.
      - name: The JNI bridge Android loads
        run: crates/ephemeral-android/tests/jni.sh
      - name: A real provider reaches the network only through curl
        run: |
          if grep -rniE 'reqwest|hyper|ureq|tokio' \
               crates/ephemeral-provider-*/Cargo.toml; then
            echo "An HTTP stack appeared in a provider crate (ADR-0016)."
            exit 1
          fi
          # A provider has no business spawning anything: the transport lives
          # in ephemeral-agent now, shared by every provider.
          if grep -rn 'process::Command' crates/ephemeral-provider-*/src \
               --include='*.rs'; then
            echo "A provider spawns a process. Transport belongs in ephemeral-agent."
            exit 1
          fi
          if grep -rln 'process::Command' crates/ephemeral-agent/src \
               --include='*.rs' | grep -v 'transport.rs'; then
            echo "Something outside the transport module spawns a process."
            echo "The untested surface is meant to stay in one small place."
            exit 1
          fi
          cargo build -p ephemeral-agent --no-default-features
          echo "Provider transport is confined to curl, in one module."
      # `local` is a promise about where a request goes (ADR-0019). Which URLs
      # it accepts is tested in the crate, against the ones built to defeat it —
      # a loopback address as userinfo, as a subdomain, as a label. What a test
      # inside the crate cannot make obvious is the default, which is what
      # somebody who configures nothing gets.
      - name: The local provider's default endpoint is loopback
        run: |
          if ! grep -qE '^pub const BASE_URL: &str = "http://(127\.0\.0\.1|\[::1\]|localhost)' \
                 crates/ephemeral-provider-local/src/lib.rs; then
            echo "The local provider's default endpoint is not on this machine."
            exit 1
          fi
          echo "The local provider defaults to loopback."

  # The desktop window renders the permission prompt, and a UI that can only be
  # exercised by opening a window is a UI nobody tests. Its rendering is pure
  # functions over the same views the CLI shows, run here in headless Chromium.
  desktop:
    name: Desktop rendering
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install a browser
        run: npm install --no-save playwright && npx playwright install --with-deps chromium
        working-directory: apps/desktop
      - run: node tests/render.test.mjs
        working-directory: apps/desktop

  # The window's Rust half is a separate workspace — Tauri needs system
  # libraries the rest of Ephemeral must not require — so nothing else here
  # compiles it. A command that does not build is a button that does nothing,
  # and the rendering tests above cannot see that: they run against the page,
  # with the commands stubbed.
  window:
    name: Desktop commands compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: The libraries a window needs
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: apps/desktop/src-tauri
      - run: cargo test
        working-directory: apps/desktop/src-tauri

  # The phone's shell is Kotlin, in its own Gradle build, so nothing else here
  # compiles it — and until this job existed nothing did until a release was
  # cut. A screen that does not build is a screen nobody can open, and the JNI
  # tests above deliberately cover the bridge rather than the application.
  #
  # No Gradle wrapper is committed: a wrapper is a binary jar in the tree, and
  # this repository would rather pin a version here than carry one.
  android:
    name: The Android application compiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      # Debug rather than release: signing needs a key, and what this job is
      # for is whether the Kotlin and the resources are sound. The native
      # libraries are built by ../build-native.sh and are absent here, which
      # the build tolerates — an APK with no engine in it still proves the
      # screens compile.
      - run: gradle assembleDebug --no-daemon
        working-directory: apps/android
      # A generated application's page is displayed in a WebView, and this
      # application holds INTERNET because generating needs it. A WebView
      # inherits that: with scripts on, or with network loads unblocked, a page
      # a model wrote could send what it was shown anywhere — through fetch, or
      # through the query string of an image. The sandbox the application ran in
      # has no sockets, and the view that displays its output must not supply
      # one. No test can see this; a grep can.
      - name: The page a generated application wrote cannot phone home
        run: |
          view=apps/android/app/src/main/java/io/github/jgalego/ephemeral/DetailActivity.kt
          if grep -nE 'javaScriptEnabled\s*=\s*true' "$view"; then
            echo "Scripts were enabled in the view that renders generated markup."
            exit 1
          fi
          for locked in \
            'javaScriptEnabled = false' \
            'blockNetworkLoads = true' \
            'allowFileAccess = false' \
            'allowContentAccess = false'; do
            if ! grep -qF "$locked" "$view"; then
              echo "The WebView no longer sets: $locked"
              exit 1
            fi
          done
          if ! grep -qF 'loadDataWithBaseURL(null,' "$view"; then
            echo "The page is loaded with a base URL, so relative references resolve."
            exit 1
          fi
          echo "A generated page is rendered with nothing to reach out with."

  # The iOS application is Swift, and Swift for iOS needs a Mac. Nothing in
  # this repository could compile it, so until this job existed the only Swift
  # here was a snippet in a document — which is to say, code nobody had ever
  # put through a compiler.
  #
  # A type-check rather than an .ipa: an archive needs an Xcode project and a
  # signing identity, and neither exists yet (see the roadmap). What this
  # catches is everything a compiler catches, which on a SwiftUI screen is most
  # of it. It runs against the real iOS SDK, with the real C header, through
  # the module map the XCFramework carries.
  ios:
    name: The iOS application type-checks
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2

      # The engine, for the simulator this checks against. Swift needs the
      # module to import; it does not need it linked, but building it here also
      # means the header and the library are checked against each other on the
      # one platform where that pairing actually ships.
      - name: The engine, for the simulator
        run: |
          rustup target add aarch64-apple-ios-sim
          cargo build -p ephemeral-ffi --target aarch64-apple-ios-sim --release

      - name: Type-check the application
        run: apps/ios/typecheck.sh

  supply-chain:
    name: Supply chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: Advisories, licences, sources and duplicate dependencies
        run: cargo deny --all-features check

  # The lockfile is authoritative. A build that silently resolves a different
  # dependency set than the one committed is not reproducible, and is exactly
  # how a supply-chain surprise arrives.
  lockfile:
    name: Lockfile is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - run: cargo metadata --locked --format-version 1 > /dev/null

  # One required check for branch protection, so the rule does not need editing
  # every time a job is added.
  ci:
    name: CI
    runs-on: ubuntu-latest
    if: always()
    needs:
      - format
      - lint
      - docs
      - test
      - security-invariants
      - domain-purity
      - generation
      - desktop
      - window
      - android
      - ios
      - supply-chain
      - lockfile
    steps:
      - name: Check that every job succeeded
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "At least one job failed."
            exit 1
          fi
          echo "All jobs succeeded."
