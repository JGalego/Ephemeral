name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A superseded run tells you nothing useful, so cancel it — except on main,
# where every commit's result is part of the record.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Deliberately no workspace-wide `RUSTFLAGS: -D warnings`: it applies to
  # dependencies as well, so an upstream crate emitting a warning would turn
  # the pipeline red for something we did not write and cannot fix. The lint
  # job denies warnings on our own code, which is the part we control.

jobs:
  format:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - run: cargo fmt --all -- --check

  lint:
    name: Lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features

  # The security suite runs as its own job so that a failure is legible at a
  # glance rather than buried in a general test run. Each of its tests is an
  # executable statement of something SECURITY.md promises.
  security-invariants:
    name: Security invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p ephemeral-core --test security -- --nocapture

  # ephemeral-core must stay free of host I/O: the domain layer is compiled for
  # five platforms, and anything that touches the host belongs behind a trait in
  # another crate (ADR-0002). Building without default features is what keeps
  # that honest rather than aspirational.
  domain-purity:
    name: Domain layer has no host I/O
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p ephemeral-core --no-default-features
      - run: cargo test -p ephemeral-core --no-default-features
      # The same argument applies one layer out: what a sandbox confines is
      # decided by pure functions, so the decision compiles and is tested
      # without the half of the crate that can spawn a process (ADR-0014).
      - run: cargo build -p ephemeral-runtime --no-default-features
      - run: cargo test -p ephemeral-runtime --no-default-features

  # CI never makes a live model call (ADR-0008). Generation is exercised
  # entirely through the deterministic mock provider, so this job proves the
  # loop works without a credential, a network connection, or a bill.
  generation:
    name: Generation runs against the mock only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p ephemeral-agent
      - name: The whole journey, sentence to running application
        run: cargo test -p ephemeral-agent --test journey -- --nocapture
      - name: The reference application actually runs
        run: cargo test -p ephemeral-agent --test reference_app -- --nocapture
      - name: No network client in the agent crate
        run: |
          if grep -rniE 'reqwest|hyper|ureq|api\.anthropic|api\.openai' \
               crates/ephemeral-agent/src crates/ephemeral-agent/Cargo.toml; then
            echo "A network client appeared in the agent crate."
            echo "Live model calls must stay out of CI (ADR-0008)."
            exit 1
          fi
          echo "No network client in the agent crate."

  supply-chain:
    name: Supply chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: Advisories, licences, sources and duplicate dependencies
        run: cargo deny --all-features check

  # The lockfile is authoritative. A build that silently resolves a different
  # dependency set than the one committed is not reproducible, and is exactly
  # how a supply-chain surprise arrives.
  lockfile:
    name: Lockfile is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - run: cargo metadata --locked --format-version 1 > /dev/null

  # One required check for branch protection, so the rule does not need editing
  # every time a job is added.
  ci:
    name: CI
    runs-on: ubuntu-latest
    if: always()
    needs:
      - format
      - lint
      - docs
      - test
      - security-invariants
      - domain-purity
      - generation
      - supply-chain
      - lockfile
    steps:
      - name: Check that every job succeeded
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "At least one job failed."
            exit 1
          fi
          echo "All jobs succeeded."
