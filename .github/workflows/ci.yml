name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Called by the release workflow, so that nothing is ever published unless
  # every check here is true of the exact commit being released. Without this
  # the release fails at its first job, which is how it sat until somebody ran
  # it: a reusable workflow that never declared itself reusable.
  workflow_call:

# A superseded run tells you nothing useful, so cancel it — except on main,
# where every commit's result is part of the record.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Deliberately no workspace-wide `RUSTFLAGS: -D warnings`: it applies to
  # dependencies as well, so an upstream crate emitting a warning would turn
  # the pipeline red for something we did not write and cannot fix. The lint
  # job denies warnings on our own code, which is the part we control.

jobs:
  format:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - run: cargo fmt --all -- --check

  lint:
    name: Lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features

  # The security suite runs as its own job so that a failure is legible at a
  # glance rather than buried in a general test run. Each of its tests is an
  # executable statement of something SECURITY.md promises.
  security-invariants:
    name: Security invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p ephemeral-core --test security -- --nocapture

  # ephemeral-core must stay free of host I/O: the domain layer is compiled for
  # five platforms, and anything that touches the host belongs behind a trait in
  # another crate (ADR-0002). Building without default features is what keeps
  # that honest rather than aspirational.
  domain-purity:
    name: Domain layer has no host I/O
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p ephemeral-core --no-default-features
      - run: cargo test -p ephemeral-core --no-default-features
      # The same argument applies one layer out: what a sandbox confines is
      # decided by pure functions, so the decision compiles and is tested
      # without the half of the crate that can spawn a process (ADR-0014).
      - run: cargo build -p ephemeral-runtime --no-default-features
      - run: cargo test -p ephemeral-runtime --no-default-features

  # CI never makes a live model call (ADR-0008). Generation is exercised
  # entirely through the deterministic mock provider, so this job proves the
  # loop works without a credential, a network connection, or a bill.
  generation:
    name: Generation runs against the mock only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p ephemeral-agent
      - name: The whole journey, sentence to running application
        run: cargo test -p ephemeral-agent --test journey -- --nocapture
      - name: The reference application actually runs
        run: cargo test -p ephemeral-agent --test reference_app -- --nocapture
      - name: No network client in the agent crate
        run: |
          if grep -rniE 'reqwest|hyper|ureq|api\.anthropic|api\.openai' \
               crates/ephemeral-agent/src crates/ephemeral-agent/Cargo.toml; then
            echo "A network client appeared in the agent crate."
            echo "Live model calls must stay out of CI (ADR-0008)."
            exit 1
          fi
          echo "No network client in the agent crate."
      - run: cargo test -p ephemeral-provider-anthropic
      - run: cargo test -p ephemeral-provider-openai
      - run: cargo test -p ephemeral-provider-local
      # Generating is an HTTPS request; iOS cannot spawn a process. A provider
      # whose only transport is `curl` silently decides that Ephemeral cannot
      # generate on a phone, so the crate must build with no subprocess at all
      # (ADR-0007). This is the check that keeps mobile generation possible.
      - name: Generation is portable off the desktop
        run: |
          for provider in anthropic openai local; do
            cargo build -p "ephemeral-provider-$provider" --no-default-features
            cargo test -p "ephemeral-provider-$provider" --no-default-features
          done
      # Swift and Kotlin both reach Ephemeral through C. Compiling a host
      # against the real header and static library is the only check that
      # catches a declaration drifting from its export.
      - name: The C ABI a phone links against
        run: crates/ephemeral-ffi/tests/c-abi.sh
      # Compiling for x86-64 proves the contract; it does not prove the crate
      # survives the trip to a device. A static library is assembled rather
      # than linked, so iOS and Android archives build here without Xcode or
      # the NDK, and their symbol tables are checked against the header.
      - name: Ephemeral builds for the device
        run: crates/ephemeral-ffi/tests/device-targets.sh
        env:
          # A check that quietly stops checking is worse than no check.
          EPHEMERAL_REQUIRE_SYMBOLS: 1
      # Android reaches that C ABI through JNI, which is resolved by name at run
      # time — so a drifted symbol or signature compiles and then fails on a
      # phone. A desktop JVM binds it identically, and the runner has one.
      - name: The JNI bridge Android loads
        run: crates/ephemeral-android/tests/jni.sh
      - name: A real provider reaches the network only through curl
        run: |
          if grep -rniE 'reqwest|hyper|ureq|tokio' \
               crates/ephemeral-provider-*/Cargo.toml; then
            echo "An HTTP stack appeared in a provider crate (ADR-0016)."
            exit 1
          fi
          # A provider has no business spawning anything: the transport lives
          # in ephemeral-agent now, shared by every provider.
          if grep -rn 'process::Command' crates/ephemeral-provider-*/src \
               --include='*.rs'; then
            echo "A provider spawns a process. Transport belongs in ephemeral-agent."
            exit 1
          fi
          if grep -rln 'process::Command' crates/ephemeral-agent/src \
               --include='*.rs' | grep -v 'transport.rs'; then
            echo "Something outside the transport module spawns a process."
            echo "The untested surface is meant to stay in one small place."
            exit 1
          fi
          cargo build -p ephemeral-agent --no-default-features
          echo "Provider transport is confined to curl, in one module."
      # `local` is a promise about where a request goes (ADR-0019). Which URLs
      # it accepts is tested in the crate, against the ones built to defeat it —
      # a loopback address as userinfo, as a subdomain, as a label. What a test
      # inside the crate cannot make obvious is the default, which is what
      # somebody who configures nothing gets.
      - name: The local provider's default endpoint is loopback
        run: |
          if ! grep -qE '^pub const BASE_URL: &str = "http://(127\.0\.0\.1|\[::1\]|localhost)' \
                 crates/ephemeral-provider-local/src/lib.rs; then
            echo "The local provider's default endpoint is not on this machine."
            exit 1
          fi
          echo "The local provider defaults to loopback."

  # The desktop window renders the permission prompt, and a UI that can only be
  # exercised by opening a window is a UI nobody tests. Its rendering is pure
  # functions over the same views the CLI shows, run here in headless Chromium.
  desktop:
    name: Desktop rendering
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install a browser
        run: npm install --no-save playwright && npx playwright install --with-deps chromium
        working-directory: apps/desktop
      - run: node tests/render.test.mjs
        working-directory: apps/desktop

  supply-chain:
    name: Supply chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: Advisories, licences, sources and duplicate dependencies
        run: cargo deny --all-features check

  # The lockfile is authoritative. A build that silently resolves a different
  # dependency set than the one committed is not reproducible, and is exactly
  # how a supply-chain surprise arrives.
  lockfile:
    name: Lockfile is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - run: cargo metadata --locked --format-version 1 > /dev/null

  # One required check for branch protection, so the rule does not need editing
  # every time a job is added.
  ci:
    name: CI
    runs-on: ubuntu-latest
    if: always()
    needs:
      - format
      - lint
      - docs
      - test
      - security-invariants
      - domain-purity
      - generation
      - desktop
      - supply-chain
      - lockfile
    steps:
      - name: Check that every job succeeded
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "At least one job failed."
            exit 1
          fi
          echo "All jobs succeeded."
