name: Device

# Runs the Android application on a real phone, through Firebase Test Lab.
#
# `screens.yml` runs it on an emulator, which is the real Android framework on
# a machine pretending to be a handset. This is a handset: a physical device in
# a rack somewhere, with a real GPU, a real keyboard, real fonts and a real
# amount of memory. The roadmap has wanted this row for a long time and the
# blocker was never technical — it is an account, and accounts belong to people
# rather than to repositories.
#
# Deliberately dispatch-only. It costs somebody's quota (Test Lab's free tier
# is five physical-device runs a day), it needs a credential this repository
# does not hold, and a workflow that goes red because nobody has signed up for
# anything is noise rather than a check.
#
# What it produces is what `screens.yml` produces: pictures, a video and a
# crash log, for a person to look at. Robo drives the application itself —
# it explores, taps things, and reports what it broke.

on:
  workflow_dispatch:
    inputs:
      model:
        description: >
          Which phone. `gcloud firebase test android models list
          --filter=form=PHYSICAL` lists what exists today; model ids come and go
          as devices are retired.
        default: "shiba"
        type: string
      version:
        description: The Android API level to run it on.
        default: "34"
        type: string
      minutes:
        description: How long to let Robo explore.
        default: "5"
        type: string
      generate:
        description: >
          Whether to put the MODEL_API_KEY secret into the app and let Robo
          press Generate. Off by default: it spends a real model call, and the
          key reaches the phone through the command line (see below).
        default: false
        type: boolean
      service:
        description: >
          Which service to point the app at. A rack phone gets a fresh install
          every run, so whatever is set here is the whole of what it knows.
        default: "openai"
        type: choice
        options: [openai, anthropic, mock]
      base_url:
        description: >
          The service's base URL. Blank means that provider's own — for OpenAI,
          api.openai.com; for Groq, paste https://api.groq.com/openai/v1.
        # Blank, and it has to stay blank. An input with a non-empty default
        # cannot be cleared: dispatching it as "" gets the default back, so
        # "use the provider's own endpoint" was unsayable and a run aimed at
        # OpenAI silently went to Groq with an OpenAI key.
        default: ""
        type: string
      # Not `model`: that is the phone, above, and gcloud's own word for it.
      # Both were called `model` until GitHub rejected the file — a duplicate
      # key, which YAML tolerates by keeping the last and Actions does not
      # tolerate at all.
      llm_model:
        description: >
          Which model the app generates with. Blank means that provider's own
          default. `ephemeral models --provider openai` lists what a service
          has, and what size of reply each will accept.
        # Blank for the same reason as base_url: a non-empty default here is one
        # nobody can dispatch their way out of.
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: device-${{ github.ref }}
  cancel-in-progress: false

jobs:
  phone:
    name: The Android application, on a phone
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Read once here, because the `secrets` context cannot be used in an
      # `if:` and a step that silently does nothing is worse than one that says
      # what is missing.
      PROJECT: ${{ secrets.FIREBASE_PROJECT_ID }}
      KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      MODEL_KEY: ${{ secrets.MODEL_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Check there is an account to use
        run: |
          missing=""
          [ -z "$PROJECT" ] && missing="$missing FIREBASE_PROJECT_ID"
          [ -z "$KEY" ] && missing="$missing FIREBASE_SERVICE_ACCOUNT"

          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing"
            echo "apps/android/README.md has the twenty minutes of setup this needs."
            exit 1
          fi
          echo "Both secrets are present."

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      # A real phone is ARM. The emulator job builds x86-64 for the same reason
      # in reverse — an APK carrying the wrong architecture installs perfectly
      # and then cannot find its engine.
      - name: The engine, for a real phone
        run: |
          rustup target add aarch64-linux-android
          EPHEMERAL_ANDROID_ABIS=arm64-v8a ./build-native.sh
        working-directory: apps/android
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}

      - name: Build the application
        run: gradle assembleDebug --no-daemon
        working-directory: apps/android

      # `gcloud` is on the runner image, so no third-party action is added to a
      # repository that is careful about what runs in the pipeline that also
      # signs its releases. The key file is written to the runner's temporary
      # directory and the runner is destroyed afterwards.
      - name: Sign in
        run: |
          printf '%s' "$KEY" > "$RUNNER_TEMP/key.json"
          gcloud auth activate-service-account --key-file="$RUNNER_TEMP/key.json"
          gcloud config set project "$PROJECT" --quiet
          rm -f "$RUNNER_TEMP/key.json"

      # Asked, not guessed — but only things this account can actually be
      # expected to answer. The first version of this called
      # `get-iam-policy` and `buckets list`, neither of which a Test Lab
      # service account needs permission for, so it printed two 403s that
      # said nothing about the 403 being investigated.
      #
      # What is left is the one mismatch that produces exactly this symptom
      # and survives adding the correct role: a service account created in a
      # different project from the one the run targets. Roles granted in one
      # mean nothing in the other, and a service account's email says which
      # project it lives in, so this can be checked rather than wondered about.
      - name: Who this is
        run: |
          account=$(gcloud config get account 2>/dev/null)
          lives_in=$(echo "$account" | sed -n 's/.*@\(.*\)\.iam\.gserviceaccount\.com/\1/p')

          echo "Signed in as:  $account"
          echo "Targeting:     $PROJECT"
          echo "Account is in: ${lives_in:-unknown}"

          if [ -n "$lives_in" ] && [ "$lives_in" != "$PROJECT" ]; then
            echo "::error::The account lives in '$lives_in'; the run targets '$PROJECT'."
            echo "Roles granted in one project mean nothing in the other."
            echo "Either set FIREBASE_PROJECT_ID to '$lives_in', or make a key in '$PROJECT'."
            exit 1
          fi

      # A note about the key, because it is the one thing here that is not
      # obviously safe. Test Lab has no secret mechanism: the only way to get a
      # credential onto a phone in a rack is to send it with the run, so it is
      # in the Robo script this step writes and in the run record Test Lab
      # keeps. Everywhere else in this repository a credential travels on stdin
      # for exactly that reason (ADR-0016), and this is a place that cannot.
      #
      # It is a file rather than a command-line argument now, which keeps it out
      # of the runner's process table. That is the smaller half of the problem;
      # the larger half is that Google has a copy either way.
      #
      # So: use a key made for the run and revoked after it, not one you use for
      # anything else. That is not a workaround for a gap, it is what a
      # credential handed to somebody else's rack of phones is worth.
      - name: Run it on a phone
        env:
          SERVICE: ${{ inputs.service }}
          BASE_URL: ${{ inputs.base_url }}
          LLM_MODEL: ${{ inputs.llm_model }}
        run: |
          set -uo pipefail

          # No `--results-bucket`. Test Lab has a bucket of its own and will
          # use it; making one instead needs billing enabled on the project,
          # which the free plan does not have — so the first thing somebody
          # following the setup would have hit is a permission error at the
          # last step, for a bucket they never needed.
          #
          # Without generation this is one directive pair: type the intent,
          # press Create. That is deliberately *one* click, because
          # `--robo-directives` allows exactly one and no more:
          #
          #   "No more than one `click` element is allowed."
          #
          # The generation walkthrough needs five, so it cannot be directives at
          # all. It is a Robo script — a JSON list of actions Robo replays
          # before it starts exploring, which is what Google provides for
          # getting past exactly this sort of front door. The version that used
          # five click directives was rejected at validation with
          # INVALID_ROBO_DIRECTIVES every time it ran, which was never, because
          # a duplicate key in this file meant it did not parse.
          steer=(--robo-directives "text:intent=compare two CSV files,click:create=")

          if [ "${{ inputs.generate }}" = "true" ]; then
            if [ -z "$MODEL_KEY" ]; then
              echo "::error::No MODEL_API_KEY secret, so there is nothing to generate with."
              exit 1
            fi

            # Built from the committed template rather than written here, so the
            # thing that runs is the thing that was reviewed — with the key, the
            # chosen service, and any endpoint or model filled in.
            python3 - "$RUNNER_TEMP/robo.json" <<'BUILD'
          import json, os, sys

          script = json.load(open("apps/android/robo/generate.json"))
          service = os.environ["SERVICE"]
          package = "io.github.jgalego.ephemeral"

          for action in script:
              for descriptor in action.get("elementDescriptors", []):
                  if descriptor.get("resourceId", "").endswith("/provider_openai"):
                      descriptor["resourceId"] = f"{package}:id/provider_{service}"
              if action.get("replacementText") == "MODEL_KEY_GOES_HERE":
                  action["replacementText"] = os.environ["MODEL_KEY"]

          # Typed only when asked for. A blank box is the provider's own default,
          # and typing an empty string into it is not the same thing.
          def typed(where, what):
              return {
                  "eventType": "VIEW_TEXT_CHANGED",
                  "replacementText": what,
                  "elementDescriptors": [{"resourceId": f"{package}:id/{where}"}],
              }

          extra = []
          if os.environ.get("BASE_URL"):
              extra.append(typed("base_url", os.environ["BASE_URL"]))
          if os.environ.get("LLM_MODEL"):
              extra.append(typed("model", os.environ["LLM_MODEL"]))

          if extra:
              at = next(i for i, a in enumerate(script)
                        if any(d.get("resourceId", "").endswith("/credential")
                               for d in a.get("elementDescriptors", [])))
              script[at:at] = extra

          json.dump(script, open(sys.argv[1], "w"), indent=2)
          print(f"Robo script: {len(script)} actions", file=sys.stderr)
          BUILD

            steer=(--robo-script "$RUNNER_TEMP/robo.json")
          fi

          set +e
          gcloud firebase test android run \
            --type robo \
            --app apps/android/app/build/outputs/apk/debug/app-debug.apk \
            --device "model=${{ inputs.model }},version=${{ inputs.version }},locale=en,orientation=portrait" \
            --timeout "${{ inputs.minutes }}m" \
            "${steer[@]}" \
            2>&1 | tee run.log
          outcome=${PIPESTATUS[0]}
          set -e

          # The two ways this fails that are not the application's fault, each
          # said in the words that fix it. Both were found by somebody hitting
          # them: a 403 on upload reads as though Test Lab is broken, and a
          # retired device id reads as though the command is wrong.
          if [ "$outcome" -ne 0 ] && grep -qE "storage.objects|PERMISSION_DENIED|403" run.log; then
            echo "::error::The service account is not allowed to do that."
            echo "Give it the Editor role, which is what Google's own CI"
            echo "instructions for Test Lab ask for:"
            echo "  Cloud console -> IAM & Admin -> IAM -> edit"
            echo "  $(gcloud config get account) -> add role -> Editor"
            echo "Narrower roles were tried and each fails somewhere different and late."
          fi

          if [ "$outcome" -ne 0 ] && grep -qiE "model|INVALID_ARGUMENT" run.log; then
            echo "::notice::If that device is gone, these are the ones that are not:"
            gcloud firebase test android models list --filter=form=PHYSICAL || true
          fi

          # Where it put the pictures. gcloud says so in prose rather than in a
          # field, so this reads it back out of what it said.
          bucket_and_dir=$(grep -oE 'storage/browser/[^]/[:space:]]+/[^]/[:space:]]+' run.log | head -1 | sed 's|storage/browser/||')
          if [ -n "$bucket_and_dir" ]; then
            echo "RESULTS=gs://$bucket_and_dir" >> "$GITHUB_ENV"
            echo "Results in gs://$bucket_and_dir"
          else
            echo "::warning::Could not tell from the output where the results went."
          fi

          exit "$outcome"

      # Whatever it managed to produce, even when the run itself failed — a
      # crash is exactly the case where the pictures matter most.
      - name: Collect what it saw
        if: always()
        run: |
          mkdir -p device
          if [ -n "${RESULTS:-}" ]; then
            gcloud storage cp -r "$RESULTS/*" device/ || echo "Nothing could be downloaded."
          fi
          cp run.log device/ 2>/dev/null || true
          find device -type f | head -50

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-on-a-phone
          path: device/
          if-no-files-found: warn
