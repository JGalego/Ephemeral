name: Release

# Releases are cut from a tag, never from a branch. A build whose inputs cannot
# be named afterwards is not something to hand somebody and call a release.
#
# `workflow_dispatch` builds everything and publishes nothing, which is how you
# find out the pipeline works without cutting a release to discover it does not.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # A tag that disagrees with the version in the tree produces artifacts named
  # after one release and tagged as another, and nobody notices until somebody
  # downloads the wrong thing. Checked before anything is built, because the
  # version is baked into every installer's filename and metadata.
  version:
    name: Tag matches the tree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare
        run: |
          set -euo pipefail
          crates=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          desktop=$(grep -m1 '"version"' apps/desktop/src-tauri/tauri.conf.json | cut -d'"' -f4)

          echo "workspace: $crates"
          echo "desktop:   $desktop"

          if [ "$crates" != "$desktop" ]; then
            echo "::error::The workspace is $crates and the desktop window is $desktop."
            exit 1
          fi

          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            tagged="${GITHUB_REF_NAME#v}"
            if [ "$tagged" != "$crates" ]; then
              echo "::error::Tagged $GITHUB_REF_NAME but the tree says $crates."
              exit 1
            fi
            echo "Tag $GITHUB_REF_NAME matches."
          else
            echo "Not a tag; nothing will be published."
          fi

  # Nothing is published unless everything CI checks is true of the exact commit
  # being released. A release that skipped a check is a release nobody verified.
  verify:
    name: Verify
    needs: version
    uses: ./.github/workflows/ci.yml

  cli:
    name: CLI (${{ matrix.target }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-gnu, linker: gcc-aarch64-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: windows-latest, target: aarch64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # Cross-compiling to ARM Linux needs a linker for it. Nothing else in the
      # matrix does: every other pair is either native or handled by the
      # platform's own toolchain.
      - name: Install a cross linker
        if: matrix.linker != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.linker }}
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      # `--locked` is the point of committing a lockfile. A release that
      # resolved a different dependency set than the one on record is exactly
      # the supply-chain surprise the policy exists to prevent.
      - name: Build
        run: cargo build --release --locked -p ephemeral-cli --target ${{ matrix.target }}

      # An archive rather than a bare binary: it carries the licence and the
      # readme with the thing they apply to, and it is what every package
      # manager and unpacking tool already expects.
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          [ "${GITHUB_REF_TYPE:-}" = "tag" ] || version="$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
          stem="ephemeral-${version}-${{ matrix.target }}"

          mkdir -p "staging/$stem" dist
          cp LICENSE README.md "staging/$stem/"

          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/ephemeral.exe" "staging/$stem/"
            (cd staging && 7z a -tzip "../dist/$stem.zip" "$stem" >/dev/null)
          else
            cp "target/${{ matrix.target }}/release/ephemeral" "staging/$stem/"
            chmod +x "staging/$stem/ephemeral"
            tar -czf "dist/$stem.tar.gz" -C staging "$stem"
          fi

          ls -la dist

      # A checksum somebody can compare against what they downloaded. Not a
      # signature: it says the file is intact, not who made it, and the two must
      # not be confused.
      - name: Checksums
        shell: bash
        run: |
          cd dist
          if command -v sha256sum >/dev/null; then
            sha256sum * > "SHA256SUMS-cli-${{ matrix.target }}.txt"
          else
            shasum -a 256 * > "SHA256SUMS-cli-${{ matrix.target }}.txt"
          fi
          cat "SHA256SUMS-cli-${{ matrix.target }}.txt"

      - uses: actions/upload-artifact@v7
        with:
          name: cli-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  desktop:
    name: Desktop (${{ matrix.name }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux-x86_64
            # Built on the oldest runner still supported, because a Linux binary
            # links the glibc it was built against and cannot run on anything
            # older. Building on the newest image is how a release ends up
            # refusing to start on a distribution released last year.
            targets: deb,rpm,appimage
          - os: macos-latest
            name: macos-universal
            # One artifact for both Apple architectures. Two downloads that
            # differ only by a word most people cannot check about their own
            # machine is a way of handing somebody the wrong file.
            rust: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin
            targets: dmg,app
          - os: windows-latest
            name: windows-x86_64
            # Both, deliberately: MSI is what a managed Windows fleet installs
            # without asking, NSIS is what a person double-clicks.
            targets: msi,nsis
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        shell: bash
        run: |
          rustup show active-toolchain || rustup toolchain install
          if [ -n "${{ matrix.rust }}" ]; then
            for target in $(echo "${{ matrix.rust }}" | tr ',' ' '); do
              rustup target add "$target"
            done
          fi

      # Tauri needs a webview and its build dependencies, which is why the
      # desktop application is its own workspace and no other job needs any of
      # this.
      - name: Install desktop build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf \
            build-essential curl wget file libxdo-dev libssl-dev \
            libayatana-appindicator3-dev

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          key: ${{ matrix.name }}

      # `cargo build` produces a binary. An installer is a different thing, and
      # this job exists to produce the second one — an earlier version of this
      # workflow built the binary, uploaded an empty `bundle/` directory, and
      # looked exactly like it was shipping installers.
      - name: Install the Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Bundle
        run: cargo tauri build --bundles ${{ matrix.targets }} ${{ matrix.args }}
        working-directory: apps/desktop/src-tauri

      # Collected by extension rather than by name: bundle filenames are decided
      # by each platform's packaging conventions, not by us, and a glob written
      # against what we expected to be there is how the last version of this
      # published nothing at all.
      - name: Collect
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          root=apps/desktop/src-tauri/target

          # Through a file rather than a pipe or `mapfile`. A pipe puts the loop
          # in a subshell where a failed `cp` cannot fail the step, and
          # `mapfile` is bash 4 — macOS still ships bash 3.2, so the first
          # version of this worked on two runners and died on the third.
          find "$root" -path '*/release/bundle/*' -type f \
            \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \
               -o -name '*.dmg' -o -name '*.msi' -o -name '*-setup.exe' \) \
            -print > installers.txt

          if [ ! -s installers.txt ]; then
            echo "::error::No installers were produced. Bundle tree:"
            find "$root" -maxdepth 6 -path '*/release/bundle/*' | head -50
            exit 1
          fi

          while IFS= read -r file; do
            echo "  $(basename "$file")"
            cp "$file" dist/
          done < installers.txt

          # The macOS .app is a directory, so it travels as an archive. Somebody
          # who does not want a disk image still needs a way to get the window.
          if [ "${{ runner.os }}" = "macOS" ]; then
            app=$(find "$root" -maxdepth 6 -path '*/release/bundle/macos/*.app' -type d | head -1)
            if [ -n "$app" ]; then
              tar -czf "dist/Ephemeral-macos-universal.app.tar.gz" \
                -C "$(dirname "$app")" "$(basename "$app")"
            fi
          fi

          ls -la dist

      # Producing an installer and shipping an installer are different claims,
      # and only one of them can be checked here. This installs the `.deb` the
      # way a person would, then starts the installed binary against a virtual
      # display and a scratch home, so a package that unpacks but cannot open a
      # window fails the release rather than the download.
      #
      # Linux only: it is the one runner where a package manager and a virtual
      # X server are both available. macOS and Windows installers are still
      # checked only for existence, which is stated here rather than implied by
      # a green tick.
      - name: The package installs and the window opens
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get install -y ./dist/*.deb xvfb

          test -x /usr/bin/ephemeral-desktop
          test -f /usr/share/applications/Ephemeral.desktop

          Xvfb :99 -screen 0 1280x900x24 -nolisten tcp &
          sleep 3

          DISPLAY=:99 EPHEMERAL_HOME="$(mktemp -d)" \
            WEBKIT_DISABLE_COMPOSITING_MODE=1 /usr/bin/ephemeral-desktop &
          window=$!
          sleep 10

          if ! kill -0 "$window" 2>/dev/null; then
            echo "::error::The installed application exited instead of staying open."
            exit 1
          fi

          kill "$window"
          echo "Installed, started, and still running after ten seconds."

      - name: Checksums
        shell: bash
        run: |
          cd dist
          if command -v sha256sum >/dev/null; then
            sha256sum * > "SHA256SUMS-desktop-${{ matrix.name }}.txt"
          else
            shasum -a 256 * > "SHA256SUMS-desktop-${{ matrix.name }}.txt"
          fi
          cat "SHA256SUMS-desktop-${{ matrix.name }}.txt"

      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.name }}
          path: dist/
          if-no-files-found: error

  # Mobile ships a library, not an installer. There is no Ephemeral app on
  # either store yet, and shipping the engine an app embeds is the honest thing
  # to publish in the meantime: it is the part that exists, it is the part that
  # is tested, and it means the platform shell is the only thing left to write.
  #
  # What is in here generates. It does not build or run an application — that
  # needs a sandbox no phone has (ADR-0017).
  mobile-apple:
    name: Mobile (Apple)
    needs: verify
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          key: mobile-apple

      # A static library rather than a dynamic one: an app embeds this, and a
      # `cdylib` on iOS means a framework to sign, embed and load for no gain.
      # `--crate-type` overrides what the manifest asks for, so the cdylib the
      # desktop wants is not built here and no platform linker is needed.
      - name: Build
        run: |
          set -euo pipefail
          for target in aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios; do
            cargo rustc --release --locked -p ephemeral-ffi \
              --target "$target" --crate-type staticlib
          done

      # One simulator slice for both Mac architectures. An XCFramework may hold
      # only one library per platform-and-architecture-set, so the two simulator
      # builds have to be fused before it will accept them.
      - name: Fuse the simulator slices
        run: |
          set -euo pipefail
          mkdir -p build/simulator
          lipo -create \
            target/aarch64-apple-ios-sim/release/libephemeral_ffi.a \
            target/x86_64-apple-ios/release/libephemeral_ffi.a \
            -output build/simulator/libephemeral_ffi.a
          lipo -info build/simulator/libephemeral_ffi.a

      # An XCFramework is what somebody drags into Xcode. A bare `.a` makes them
      # pick the right architecture by hand and get it wrong once.
      - name: Package
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          [ "${GITHUB_REF_TYPE:-}" = "tag" ] || version="$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"

          xcodebuild -create-xcframework \
            -library target/aarch64-apple-ios/release/libephemeral_ffi.a \
            -headers crates/ephemeral-ffi/include \
            -library build/simulator/libephemeral_ffi.a \
            -headers crates/ephemeral-ffi/include \
            -output build/Ephemeral.xcframework

          cp LICENSE build/Ephemeral.xcframework/
          mkdir -p dist
          (cd build && zip -qry "../dist/Ephemeral-${version}-ios.xcframework.zip" \
             Ephemeral.xcframework)
          ls -la dist

      # An XCFramework whose Info.plist does not list both slices is one Xcode
      # accepts and then fails to link against, on whichever machine happens to
      # need the missing one.
      - name: It contains both slices
        run: |
          set -euo pipefail
          plist=build/Ephemeral.xcframework/Info.plist
          for expected in ios-arm64 ios-arm64_x86_64-simulator; do
            if ! /usr/libexec/PlistBuddy -c 'Print' "$plist" | grep -q "$expected"; then
              echo "::error::The XCFramework has no $expected slice."
              /usr/libexec/PlistBuddy -c 'Print' "$plist"
              exit 1
            fi
            echo "  $expected"
          done
          test -f build/Ephemeral.xcframework/ios-arm64/Headers/ephemeral.h
          test -f build/Ephemeral.xcframework/ios-arm64/Headers/module.modulemap
          echo "Both slices, with the header and the module map Swift imports."

      - name: Checksums
        run: |
          cd dist && shasum -a 256 * > SHA256SUMS-mobile-apple.txt
          cat SHA256SUMS-mobile-apple.txt

      - uses: actions/upload-artifact@v7
        with:
          name: mobile-apple
          path: dist/
          if-no-files-found: error

  mobile-android:
    name: Mobile (Android)
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add aarch64-linux-android armv7-linux-androideabi \
            x86_64-linux-android i686-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: mobile-android

      # No NDK here on purpose. A static library is assembled rather than
      # linked, so the Android toolchain is only needed by whoever links it into
      # an app — which is the same person who already has it.
      - name: Build
        run: |
          set -euo pipefail
          for target in aarch64-linux-android armv7-linux-androideabi \
                        x86_64-linux-android i686-linux-android; do
            cargo rustc --release --locked -p ephemeral-ffi \
              --target "$target" --crate-type staticlib
          done

      # Laid out by ABI name, which is what Android's own build system expects,
      # so this unpacks into a project rather than being rearranged first.
      - name: Package
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          [ "${GITHUB_REF_TYPE:-}" = "tag" ] || version="$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
          stem="ephemeral-${version}-android"

          mkdir -p "staging/$stem/include" dist
          cp crates/ephemeral-ffi/include/ephemeral.h "staging/$stem/include/"
          cp LICENSE README.md "staging/$stem/"

          set -- aarch64-linux-android:arm64-v8a \
                 armv7-linux-androideabi:armeabi-v7a \
                 x86_64-linux-android:x86_64 \
                 i686-linux-android:x86
          for pair in "$@"; do
            target="${pair%%:*}"; abi="${pair##*:}"
            mkdir -p "staging/$stem/jniLibs/$abi"
            cp "target/$target/release/libephemeral_ffi.a" \
               "staging/$stem/jniLibs/$abi/"
            echo "  $abi"
          done

          tar -czf "dist/$stem.tar.gz" -C staging "$stem"
          ls -la dist

      - name: Checksums
        run: |
          cd dist && sha256sum * > SHA256SUMS-mobile-android.txt
          cat SHA256SUMS-mobile-android.txt

      - uses: actions/upload-artifact@v7
        with:
          name: mobile-android
          path: dist/
          if-no-files-found: error

  android-app:
    name: Android application
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add aarch64-linux-android armv7-linux-androideabi \
            x86_64-linux-android i686-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          key: android-app

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      # Pinned rather than "whatever the runner ships". The NDK decides which
      # libc symbols the engine links against, so a silent bump is a silent
      # change to which devices the application still starts on.
      - name: Install the NDK
        run: |
          sdkmanager --install "ndk;26.3.11579264" \
            "platforms;android-34" "build-tools;34.0.0"

      - name: Build the engine
        run: |
          set -euo pipefail
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/26.3.11579264"
          apps/android/build-native.sh

      # A signing key is a credential, and SECURITY.md says those do not live in
      # this repository. Until a real one lives in repository secrets, the
      # release is signed with a key generated here and destroyed with the
      # runner. The APK installs; it will not upgrade over an earlier release,
      # because Android refuses an upgrade whose signature changed. This is the
      # Android equivalent of the unsigned .dmg, and it ends the same way.
      - name: Build the application
        run: |
          set -euo pipefail
          password="$(openssl rand -base64 32)"
          echo "::add-mask::$password"
          keystore="$RUNNER_TEMP/release.jks"

          keytool -genkeypair -keystore "$keystore" -alias ephemeral \
            -keyalg RSA -keysize 4096 -validity 10000 \
            -storepass "$password" -keypass "$password" \
            -dname "CN=Ephemeral, O=Ephemeral" >/dev/null

          version="${GITHUB_REF_NAME#v}"
          [ "${GITHUB_REF_TYPE:-}" = "tag" ] || version="$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"

          EPHEMERAL_VERSION="$version" \
          EPHEMERAL_ANDROID_KEYSTORE="$keystore" \
          EPHEMERAL_ANDROID_KEYSTORE_PASSWORD="$password" \
          EPHEMERAL_ANDROID_KEY_ALIAS=ephemeral \
          EPHEMERAL_ANDROID_KEY_PASSWORD="$password" \
            gradle --no-daemon -p apps/android assembleRelease

      - name: Package
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          [ "${GITHUB_REF_TYPE:-}" = "tag" ] || version="$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"

          mkdir -p dist
          cp apps/android/app/build/outputs/apk/release/app-release.apk \
             "dist/ephemeral-${version}.apk"

          # Refuse to ship an APK that cannot load its own engine. An APK is a
          # zip, and one that quietly lost an ABI installs perfectly and then
          # dies on `System.loadLibrary` — on somebody else's phone.
          for abi in arm64-v8a armeabi-v7a x86_64 x86; do
            unzip -l "dist/ephemeral-${version}.apk" \
              | grep -q "lib/$abi/libephemeral_android.so" \
              || { echo "no engine for $abi in the APK" >&2; exit 1; }
            echo "  $abi"
          done

          # The signing certificate's fingerprint. Not a secret, and with a
          # per-release key it is the only way to see that this release and the
          # last one were signed by different keys — which they were.
          "$ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner" verify --print-certs \
            "dist/ephemeral-${version}.apk" | tee dist/ANDROID-SIGNING.txt

      - name: Checksums
        run: |
          cd dist && sha256sum * > SHA256SUMS-android-app.txt
          cat SHA256SUMS-android-app.txt

      - uses: actions/upload-artifact@v7
        with:
          name: android-app
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish
    needs: [cli, desktop, mobile-apple, mobile-android, android-app]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # One checksum file for the whole release, rebuilt here from the artifacts
      # actually being published. Per-job files can only vouch for what that job
      # uploaded; this one vouches for what somebody can download.
      - name: Collect
        run: |
          set -euo pipefail
          mkdir -p release
          find artifacts -type f ! -name 'SHA256SUMS*' -exec cp {} release/ \;
          cd release
          sha256sum * > SHA256SUMS.txt
          echo
          cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          # Every release is a draft until somebody looks at it. Publishing
          # automatically would mean the first person to see a broken artifact
          # is whoever downloaded it.
          draft: true
          body_path: .github/RELEASE_BODY.md
