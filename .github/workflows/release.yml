name: Release

# Releases are cut from a tag, never from a branch. A build whose inputs cannot
# be named afterwards is not something to hand somebody and call a release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # Nothing is published unless everything CI checks is true of the exact commit
  # being released. A release that skipped a check is a release nobody verified.
  verify:
    name: Verify
    uses: ./.github/workflows/ci.yml

  cli:
    name: CLI (${{ matrix.target }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      # `--locked` is the point of committing a lockfile. A release that
      # resolved a different dependency set than the one on record is exactly
      # the supply-chain surprise the policy exists to prevent.
      - name: Build
        run: cargo build --release --locked -p ephemeral-cli --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          name="ephemeral-${{ matrix.target }}"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/ephemeral.exe" "dist/$name.exe"
          else
            cp "target/${{ matrix.target }}/release/ephemeral" "dist/$name"
            chmod +x "dist/$name"
          fi

      # A checksum somebody can compare against what they downloaded. Not a
      # signature: it says the file is intact, not who made it, and the two must
      # not be confused.
      - name: Checksums
        shell: bash
        run: |
          cd dist
          if command -v sha256sum >/dev/null; then
            sha256sum * > "SHA256SUMS-${{ matrix.target }}.txt"
          else
            shasum -a 256 * > "SHA256SUMS-${{ matrix.target }}.txt"
          fi
          cat "SHA256SUMS-${{ matrix.target }}.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.target }}
          path: dist/

  desktop:
    name: Desktop (${{ matrix.os }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install

      # Tauri needs a webview and its build dependencies, which is why the
      # desktop application is its own workspace and no other job needs any of
      # this.
      - name: Install desktop build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf \
            build-essential curl wget file libxdo-dev libssl-dev

      - name: Build
        run: cargo build --release --locked
        working-directory: apps/desktop/src-tauri

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            apps/desktop/src-tauri/target/release/ephemeral-desktop*
            apps/desktop/src-tauri/target/release/bundle/

  publish:
    name: Publish
    needs: [cli, desktop]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect
        run: |
          mkdir -p release
          find artifacts -type f \( -name 'ephemeral-*' -o -name 'SHA256SUMS*' \) \
            -exec cp {} release/ \;
          ls -la release

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          # Every release is a draft until somebody looks at it. Publishing
          # automatically would mean the first person to see a broken artifact
          # is whoever downloaded it.
          draft: true
          body: |
            Verify what you downloaded against `SHA256SUMS-<target>.txt`.

            A checksum says the file is intact. It does not say who built it —
            those are different claims and Ephemeral does not conflate them.
