<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ephemeral</title>
    <!-- The palette first, because everything in app.css is written in terms
         of it and nothing there may name a colour of its own. Generated from
         crates/ephemeral-design and shared with the Android app. -->
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <header>
      <div class="wordmark">
        <h1>Ephemeral</h1>
        <p class="tagline">Software that exists only while it's useful.</p>
      </div>
      <!--
        Ephemeral is dark. This is for the people it does not suit — reading
        pale text on a dark ground is harder for some eyes, not easier — and
        the choice is remembered, so it is asked once.
      -->
      <button id="appearance" type="button" aria-pressed="false">Light</button>
    </header>

    <main>
      <section id="compose" aria-label="Ask for an application"></section>

      <section id="applications" aria-label="Your applications">
        <p class="empty" id="empty" hidden>
          No applications yet. Ask for one and Ephemeral will build it.
        </p>
        <ul id="list"></ul>
      </section>

      <section id="detail" aria-label="Application" hidden></section>

      <section id="machine" aria-label="Ephemeral itself" hidden></section>
    </main>

    <p class="problem" id="problem" role="alert" hidden></p>
    <div class="notice" id="notice" role="status" hidden></div>

    <script type="module" src="app.js"></script>
  </body>
</html>
