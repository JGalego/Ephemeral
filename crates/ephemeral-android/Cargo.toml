[package]
name = "ephemeral-android"
description = "The JNI bridge, so an Android application can drive Ephemeral's C ABI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[lib]
# `cdylib` because Android loads this with `System.loadLibrary`. `rlib` so the
# crate's own tests can link it like any other.
crate-type = ["cdylib", "rlib"]

# Built for every target, not just Android, and that is the point: JNI is the
# same on a desktop JVM, so `tests/jni.sh` can load this library into an
# ordinary `java` process and call it. Restricting the crate to Android would
# make the one piece of code here that is easy to get wrong — the callback into
# Java — the one piece nothing could test without a phone.
[dependencies]
ephemeral-ffi.workspace = true
jni = "0.21.1"

# Lints are NOT inherited from the workspace, for the same reason as
# `ephemeral-ffi`: a JNI entry point is `extern "system"` over raw pointers and
# cannot be written safely. The unsafety is confined here, denied by default,
# and allowed only on individual items carrying a `# Safety` section.
[lints.rust]
missing_docs = "warn"
unsafe_code = "deny"
unreachable_pub = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
