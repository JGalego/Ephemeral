[package]
name = "ephemeral-agent"
description = "Ephemeral's provider-neutral generation interface, and the deterministic mock provider every test runs against."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[features]
default = ["curl"]
# Spawning `curl` is the desktop transport. A feature rather than the only
# option, because iOS forbids one process spawning another (ADR-0017).
curl = []

[dependencies]
ephemeral-core.workspace = true

serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true

[lints]
workspace = true

[dev-dependencies]
tempfile.workspace = true
