[package]
name = "ephemeral-cli"
description = "The Ephemeral command line: the same domain model the desktop application uses, driven from a terminal."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[[bin]]
name = "ephemeral"
path = "src/main.rs"

[dependencies]
ephemeral-api.workspace = true
ephemeral-core.workspace = true
ephemeral-runtime.workspace = true
ephemeral-agent.workspace = true
serde_norway.workspace = true
ephemeral-provider-anthropic.workspace = true
# The wire format's `curl` transport, which the root manifest leaves off so the
# local provider can borrow the format without it.
ephemeral-provider-openai = { workspace = true, features = ["curl"] }
ephemeral-provider-local.workspace = true

anyhow.workspace = true
chrono.workspace = true
clap.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
