[package]
name = "ephemeral-engine"
description = "The Ephemeral operations that need this machine: generating with a model provider, and running applications in a container runtime."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[dependencies]
ephemeral-core.workspace = true
# Both runtimes. The daemon half drives Docker; the `wasm` half is what runs
# where there is no daemon, and the engine has to reach it or a laptop is less
# capable than a phone.
ephemeral-runtime = { workspace = true, features = ["wasm"] }
ephemeral-agent.workspace = true
ephemeral-api.workspace = true
ephemeral-provider-anthropic.workspace = true
ephemeral-provider-openai = { workspace = true, features = ["curl"] }
ephemeral-provider-local.workspace = true

anyhow.workspace = true
serde.workspace = true

[dev-dependencies]
chrono.workspace = true
tempfile.workspace = true

# Test applications are written as WebAssembly text and assembled here. A
# `.wasm` blob in the repository is a thing nobody can review.
wat = "1.257.1"

[lints]
workspace = true
